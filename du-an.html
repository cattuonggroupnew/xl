<!doctype html>
<html lang="vi" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dự án | Xây lắp Cát Tường</title>
  <meta name="description" content="Danh sách dự án nhà ở xã hội, chung cư, thương mại do Xây lắp Cát Tường thi công tại Bắc Ninh.">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="projects" class="has-hero">
<main id="main">
  <section class="page-hero">
    <img class="bg" src="assets/img/hero-4.jpg" alt="">
    <div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Trang chủ</a><span aria-hidden="true">/</span><span>Dự án</span></nav>
      <h1>Dự án</h1>
      <p>Các công trình Cát Tường đã và đang thi công: nhà ở xã hội, chung cư, thương mại và nghỉ dưỡng.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <form class="toolbar" id="filter-form" role="search" aria-label="Tìm kiếm và lọc dự án">
        <div class="f-search">
          <label for="f-q">Tìm theo tên dự án</label>
          <input class="input" id="f-q" type="search" placeholder="VD: Smart City" autocomplete="off">
        </div>
        <div><label for="f-cat">Lĩnh vực</label><select class="select" id="f-cat"></select></div>
        <div><label for="f-status">Trạng thái</label><select class="select" id="f-status"></select></div>
        <div><label for="f-year">Năm khởi công</label><select class="select" id="f-year"></select></div>
        <div class="view-toggle" role="group" aria-label="Kiểu hiển thị">
          <button type="button" data-view="grid" aria-label="Dạng lưới"><span data-icon="grid"></span></button>
          <button type="button" data-view="list" aria-label="Dạng danh sách"><span data-icon="list"></span></button>
        </div>
      </form>
      <p class="result-count" id="result-count" aria-live="polite"></p>
      <div id="project-results" class="grid grid-3"></div>
      <nav class="pager" id="pager" aria-label="Phân trang"></nav>
    </div>
  </section>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
