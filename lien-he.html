<!doctype html>
<html lang="vi" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liên hệ & yêu cầu báo giá | Xây lắp Cát Tường</title>
  <meta name="description" content="Liên hệ Xây lắp Cát Tường để được tư vấn và báo giá thi công.">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact" class="has-hero">
<main id="main">
  <section class="page-hero">
    <img class="bg" src="assets/img/scy-3.jpg" alt="">
    <div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Trang chủ</a><span aria-hidden="true">/</span><span>Liên hệ</span></nav>
      <h1>Liên hệ với chúng tôi</h1>
      <p>Gửi yêu cầu báo giá, tư vấn thi công hoặc đề xuất hợp tác – chúng tôi phản hồi trong 1 ngày làm việc.</p>
    </div>
  </section>

  <section class="section section--alt">
    <div class="wrap split" style="align-items:start">
      <div class="s-7">
        <form class="form-card" data-form="contact" novalidate>
          <h2 style="font-size:clamp(30px,3vw,42px)">Yêu cầu báo giá & hợp tác</h2>
          <p class="muted">Các trường có dấu <span style="color:var(--err)">*</span> là bắt buộc.</p>
          <div class="form-grid">
            <div class="field"><label for="c-name">Họ và tên <span class="req">*</span></label><input class="input" id="c-name" name="name" required autocomplete="name" data-min="2"></div>
            <div class="field"><label for="c-company">Doanh nghiệp</label><input class="input" id="c-company" name="company" autocomplete="organization"></div>
            <div class="field"><label for="c-phone">Số điện thoại <span class="req">*</span></label><input class="input" id="c-phone" name="phone" type="tel" required data-validate="phone" autocomplete="tel" inputmode="tel"></div>
            <div class="field"><label for="c-email">Email <span class="req">*</span></label><input class="input" id="c-email" name="email" type="email" required autocomplete="email"></div>
            <div class="field full"><label for="c-need">Loại nhu cầu <span class="req">*</span></label>
              <select class="select" id="c-need" name="need" required>
                <option value="">Chọn loại nhu cầu</option>
                <option>Yêu cầu báo giá</option>
                <option>Tư vấn thi công</option>
                <option>Hợp tác đầu tư</option>
                <option>Nhà cung cấp / nhà thầu phụ</option>
                <option>Khác</option>
              </select></div>
            <div class="field full"><label for="c-msg">Nội dung yêu cầu <span class="req">*</span></label><textarea class="textarea" id="c-msg" name="message" required data-min="10" placeholder="Mô tả dự án, quy mô, địa điểm, thời gian dự kiến…"></textarea></div>
            <div class="hp" aria-hidden="true"><label>Website <input name="website" tabindex="-1" autocomplete="off"></label></div>
            <div class="field full"><label class="check"><input type="checkbox" name="consent" required data-msg="Vui lòng đồng ý để tiếp tục."> <span>Tôi đồng ý để Cát Tường lưu trữ và sử dụng thông tin này để liên hệ phản hồi. Thông tin không được công khai hay chia sẻ cho bên thứ ba.</span></label></div>
          </div>
          <button class="btn btn--brand" type="submit">Gửi yêu cầu <span data-icon="arrow"></span></button>
          <div class="form-status" role="status" aria-live="polite"></div>
        </form>
      </div>
      <aside class="s-5">
        <div class="section--dark on-dark" style="padding:clamp(28px,4vw,44px)">
          <span class="eyebrow">Thông tin liên hệ</span>
          <h3 style="color:#fff;font-size:30px;text-transform:uppercase" data-c="name"></h3>
          <ul class="info-list">
            <li><span data-icon="phone"></span><div><small>Hotline</small><a data-c="hotline" href="#"></a></div></li>
            <li><span data-icon="mail"></span><div><small>Email</small><a data-c="email" href="#"></a></div></li>
            <li><span data-icon="pin"></span><div><small>Địa chỉ</small><span data-c="address"></span></div></li>
            <li><span data-icon="clock"></span><div><small>Giờ làm việc</small><span data-c="workingHours"></span></div></li>
          </ul>
        </div>
        <div class="media ratio-43"><img src="assets/img/lobby.jpg" alt="Sảnh tòa nhà do Cát Tường thi công" loading="lazy"></div>
      </aside>
    </div>
  </section>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
